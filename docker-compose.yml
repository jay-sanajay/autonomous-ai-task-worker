version: '3.8'

services:
  agentos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentos-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
    restart: unless-stopped
